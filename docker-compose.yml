services:
  postgres:
    image: postgres:16-alpine
    container_name: cecs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cecs
      POSTGRES_USER: cecs_user
      POSTGRES_PASSWORD: cecs_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cecs_user -d cecs"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cecs_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Helper to create initial default bucket in MinIO
  createbuckets:
    image: minio/mc:latest
    container_name: cecs_createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/cecs-attachments --ignore-existing;
      /usr/bin/mc anonymous set download myminio/cecs-attachments;
      exit 0;
      "

volumes:
  postgres_data:
    name: cecs_postgres_data
  minio_data:
    name: cecs_minio_data
