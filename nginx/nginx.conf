# =============================================
# CECS — Nginx Reverse Proxy
# =============================================
# Letakkan file ini di: nginx/nginx.conf
# Jalankan bersama docker-compose.prod.yml
# =============================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Jangan umumkan versi nginx di header/halaman error
    server_tokens off;

    # ── Logging ────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── Timeouts & tuning ──────────────────────────────────
    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 15m;   # match Next.js Server Actions limit (10mb + headroom)

    # ── Rate limiting zones ────────────────────────────────
    # Login endpoint: 10 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # General app: 60 requests/second per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

    # ── Upstream ───────────────────────────────────────────
    upstream cecs_app {
        server app:3000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge passthrough
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ───────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name cecs.example.com;

        # SSL certificates (managed by Certbot / Let's Encrypt)
        # For LAN-only deployment, use self-signed or internal CA cert
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # ── Security headers (complement Next.js headers) ──
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ── Rate limit: login endpoint ─────────────────────
        location = /api/auth/callback/credentials {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://cecs_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Rate limit: login page form submit ─────────────
        location = /login {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://cecs_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── General app proxy ──────────────────────────────
        location / {
            limit_req zone=general burst=20 nodelay;

            proxy_pass http://cecs_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Next.js streaming / server-sent events support
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Block direct MinIO access ──────────────────────
        # (MinIO ports are bound to 127.0.0.1 in prod compose,
        #  so this is a defense-in-depth measure)
        location /minio/ {
            return 403;
        }

        # ── Cron & health: tidak boleh dari internet ───────
        # Aturan lama memakai `allow 127.0.0.1`, yang tidak pernah cocok:
        # dari sudut pandang container nginx, peer-nya adalah gateway Docker
        # (172.x.x.1), bukan loopback. Jadi aturan itu menolak semuanya —
        # sekaligus menutup jalur cron yang sah.
        #
        # Cron dipicu dari scheduler host langsung ke container app,
        # tanpa melewati Nginx:
        #   docker exec cecs_app sh -c 'curl -fsS -X POST -H "x-cron-token: $CRON_SECRET" http://localhost:3000/api/cron/recalc-pm'
        #
        # /api/health juga dipanggil HEALTHCHECK dari dalam container,
        # sehingga tidak perlu terekspos keluar.
        location ~ ^/api/(cron|health) {
            deny all;
            access_log off;
        }

        # ── Custom 429 response ────────────────────────────
        error_page 429 @ratelimited;
        location @ratelimited {
            default_type application/json;
            return 429 '{"error":"Terlalu banyak permintaan. Coba lagi dalam beberapa saat."}';
        }
    }
}
